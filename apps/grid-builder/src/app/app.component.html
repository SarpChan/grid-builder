<div
  class="grid h-full  overflow-hidden dark:bg-neutral-900 bg-gray-100 dark:text-white"
  [style.grid-template-columns]="
    appSettingsFacade.isPreview$()
      ? '1fr'
      : sideBarWidth() + ' 100px 7fr'
  "
  [style.grid-template-rows]="
    appSettingsFacade.isPreview$() ? '1fr' : '64px auto'
  "
  cdkDropListGroup>
  @if (!appSettingsFacade.isPreview$()) {
  <grid-builder-navbar class="nav"></grid-builder-navbar>
  <grid-builder-sidebar
    class="side p-2 pt-0 bg-gray-100 dark:bg-neutral-900 "
  ></grid-builder-sidebar>
  <grid-builder-itemsbar
    class="itemsbar p-2 pt-2 rounded-tl-md bg-white dark:bg-neutral-700"
  ></grid-builder-itemsbar>
  }
  <div
    class="transition-all"
    role="main"
    [ngClass]="{
      'col-start-3 row-start-2 row-span-2': !appSettingsFacade.isPreview$(),
      'col-start-1': appSettingsFacade.isPreview$(),
  }"
  >
    <router-outlet></router-outlet>
  </div>
</div>
