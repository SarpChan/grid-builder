<form [formGroup]="form" class="flex flex-col gap-2">
  <!-- Reference Container -->
  <brn-radio-group
    hlm
    [value]="referenceContainerValue"
    class="gap-2 flex flex-wrap justify-between"
  >
    <h2 class="col-span-2">{{ 'forms.reference_container' | translate }}</h2>

    <brn-radio hlm value="viewport" (click)="selectRf('viewport')">
      <hlm-radio-indicator
        (click)="selectRf('viewport')"
        indicator
      ></hlm-radio-indicator>
      {{ 'forms.viewport' | translate }}
    </brn-radio>

    <brn-radio hlm value="container" (click)="selectRf('container')">
      <hlm-radio-indicator
        (click)="selectRf('container')"
        indicator
      ></hlm-radio-indicator>
      {{ 'forms.container' | translate }}
    </brn-radio>
  </brn-radio-group>

  <!-- Generation Mode -->
  <grid-builder-combobox
    [options]="generationOptions"
    [label]="'forms.generation_mode' | translate"
    [currentOption]="currentGenerationMode()"
    [placeholder]="'forms.generation_mode' | translate"
    (selectOption)="selectGenerationMode($event)"
  ></grid-builder-combobox>

  <!-- Use ClassName -->
  <brn-radio-group
    hlm
    [value]="classNameValue"
    class="gap-2 flex flex-wrap justify-between"
  >
    <h2 class="col-span-2">{{ 'forms.css_class_attribute' | translate }}</h2>

    <brn-radio hlm value="true" (click)="selectClass(true)">
      <hlm-radio-indicator
        (click)="selectClass(true)"
        indicator
      ></hlm-radio-indicator>
      {{ 'forms.classname' | translate }}
    </brn-radio>

    <brn-radio hlm value="false" (click)="selectClass(false)">
      <hlm-radio-indicator
        (click)="selectClass(false)"
        indicator
      ></hlm-radio-indicator>
      {{ 'forms.class' | translate }}
    </brn-radio>
  </brn-radio-group>
</form>
