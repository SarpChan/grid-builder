<form
  [formGroup]="form"
  class="grid w-full gap-2 relative"
  [ngClass]="shouldHideValue() ? 'grid-cols-1' : 'grid-cols-2'"
>
  @if (!shouldHideValue()) {
  <label hlmLabel class="flex gap-1 flex-col">
    <span> {{ valueLabel() | translate }} </span>

    <input
      hlmInput
      class="w-full pr-0"
      type="number"
      formControlName="value"
      value="currentValue()"
      min="0"
      appearance="filled"
    />
  </label>
  }
  <grid-builder-combobox
    [currentOption]="currentOption()"
    (selectOption)="select($event)"
    [options]="actualOptions()"
    [label]="unitLabel()"
  ></grid-builder-combobox>
</form>
